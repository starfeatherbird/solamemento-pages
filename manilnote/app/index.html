<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만일의 노트 — 우리 가족 안심 기록장</title>
<meta name="theme-color" content="#F8F4EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201E19" media="(prefers-color-scheme: dark)">
<!-- 웹(PWA)용: 아이폰 사파리 '홈 화면에 추가' 시 전체화면 앱처럼 실행된다. 안드로이드 앱에서는 무해. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="만일의 노트">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/pretendard.css">
<link rel="stylesheet" href="fonts/gowun-batang/400.css">
<link rel="stylesheet" href="fonts/gowun-batang/700.css">
<style>
:root{
  --bg:#F8F4EB; --bg2:#FFFDF8; --card:#FFFDF8; --ink:#37322A; --ink2:#6E6555; --ink3:#A89C82;
  --line:#E7DFCE; --accent:#1D559C; --accent2:#EAF1F9; --accent3:#C9D9EC;
  --warn:#A96444; --warnbg:#F7EDE4; --focus:#5A85C0; --danger:#B05B4C;
  --chip:#F2EBDB; --gold:#E3A24A; --serif:'Gowun Batang','Apple SD Gothic Neo',serif;
  --shadow:0 1px 3px rgba(90,80,60,.08), 0 4px 14px rgba(90,80,60,.06);
  --radius:14px;
}
body.dark{
  --bg:#201E19; --bg2:#282521; --card:#2C2924; --ink:#E8E2D6; --ink2:#B0A897; --ink3:#7D766A;
  --line:#443F37; --accent:#8FB4E3; --accent2:#26313F; --accent3:#3D5878;
  --warn:#D99A6C; --warnbg:#3D332B; --focus:#5C8FD6; --danger:#CF8273;
  --chip:#33302A; --gold:#D9A45B;
  --shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo',"Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;transition:border .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
::placeholder{color:var(--ink3)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 90px}
/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;cursor:pointer;user-select:none}
.brand svg{flex:none}
.brand b{font-size:18px;font-family:var(--serif);color:var(--accent)}
.brand span{font-size:12px;color:var(--ink2)}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.tbtn:hover{border-color:var(--accent3)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.savebadge{font-size:11.5px;color:var(--ink3);min-width:86px;text-align:right}
/* home */
.hero{background:var(--card);border:1.5px solid var(--accent);border-radius:18px;padding:6px;margin:20px 0 18px;box-shadow:var(--shadow)}
.hero-in{border:1px dashed var(--accent3);border-radius:13px;padding:20px 18px}
.hero h1{margin:0 0 8px;font-size:22px;font-family:var(--serif);color:var(--accent);line-height:1.45}
.hero p{margin:4px 0;color:var(--ink2);font-size:13.5px}
.owner-line{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.owner-line span{font-size:14px;color:var(--ink2)}
.owner-line input{width:180px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
.scard:hover{transform:translateY(-2px);border-color:var(--accent3)}
.scard .ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--accent);border-radius:12px;flex:none}
.scard .tt{font-weight:700;font-size:15px}
.scard .st{font-size:12px;color:var(--ink3);margin-top:2px}
.scard .st b{color:var(--accent);font-weight:700}
/* section view */
.crumb{display:flex;align-items:center;gap:10px;margin:18px 0 4px}
.crumb button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px}
.sec-head{display:flex;align-items:center;gap:12px;margin:10px 0 2px}
.sec-head .ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--chip);color:var(--accent);border-radius:12px}
.sec-head h2{margin:0;font-size:22px;font-family:var(--serif);color:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 18px}
.chips a{font-size:12px;color:var(--ink2);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;text-decoration:none}
.chips a:hover{border-color:var(--accent3);color:var(--ink)}
.pagecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 16px;box-shadow:var(--shadow);overflow:hidden}
.pagecard>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;user-select:none}
.pagecard>summary::-webkit-details-marker{display:none}
.pagecard>summary .arr{margin-left:auto;color:var(--ink3);transition:transform .15s;flex:none}
.pagecard[open]>summary .arr{transform:rotate(90deg)}
.pagecard>summary h3{margin:0;font-size:16px;font-family:var(--serif)}
.pagecard>summary .cnt{font-size:11.5px;color:var(--accent);background:var(--accent2);border-radius:999px;padding:2px 9px;flex:none}
.pbody{padding:2px 18px 18px}
.pnote{font-size:13px;color:var(--ink2);background:var(--accent2);border-radius:10px;padding:10px 13px;margin:4px 0 14px}
.gtitle{font-size:13.5px;font-weight:700;color:var(--accent);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:7px}
.gnote{font-size:12.5px;color:var(--ink2);margin:-2px 0 10px}
.frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.fld .hint{font-size:11.5px;color:var(--ink3)}
.lock{font-size:11px}
body.hide-sens .fld.sens input:not(:focus),body.hide-sens .sens-cell input:not(:focus){-webkit-text-security:disc}
.optwrap{display:flex;gap:8px;flex-wrap:wrap;padding:3px 0}
.optwrap label.opt{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;cursor:pointer}
.optwrap label.opt:has(input:checked){background:var(--accent2);border-color:var(--accent);color:var(--ink)}
.optwrap input{width:auto;accent-color:var(--accent)}
/* tables */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.g{border-collapse:collapse;width:100%;min-width:520px}
table.g th{background:var(--accent2);color:var(--ink2);font-size:12px;font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.g td{border-bottom:1px solid var(--line);padding:3px;vertical-align:middle}
table.g tr:last-child td{border-bottom:none}
table.g td input{border:none;background:transparent;border-radius:6px;padding:7px 8px}
table.g td input:focus{background:var(--bg2);box-shadow:0 0 0 2px var(--focus) inset}
table.g td.preset{font-size:13px;padding:8px 10px;color:var(--ink);white-space:nowrap}
.addrow{margin-top:8px;border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:9px;padding:7px 14px;font-size:12.5px;width:100%}
.addrow:hover{border-color:var(--accent);color:var(--accent)}
/* repeat instances */
.inst{border:1px solid var(--line);border-radius:12px;padding:14px 15px 16px;margin:0 0 12px;background:var(--bg2)}
.inst-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.inst-head .no{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent2);border-radius:999px;padding:2px 9px}
.inst-head b{font-size:14.5px}
.inst-head button{margin-left:auto;border:none;background:transparent;color:var(--ink3);font-size:12px;padding:4px 6px;border-radius:7px}
.inst-head button:hover{color:var(--danger);background:var(--warnbg)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(40,35,25,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:430px;width:100%;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:18px;font-family:var(--serif);color:var(--accent)}
.modal p{font-size:13.5px;color:var(--ink2);margin:6px 0}
.modal .btns{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.bigbtn{border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:12px;padding:13px 16px;font-size:14.5px;text-align:left}
.bigbtn b{display:block}
.bigbtn small{color:var(--ink2)}
.bigbtn:hover{border-color:var(--accent)}
.modal .close{margin-top:12px;width:100%;border:none;background:transparent;color:var(--ink3);padding:8px;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:70;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.foot{margin:34px 0 10px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.8}
/* android safe area (status bar / gesture bar) */
.top{padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))}
.wrap{padding-bottom:calc(90px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)))}
#lock{padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))}
.overlay{padding-top:calc(18px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)));padding-bottom:calc(18px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));align-items:flex-start;overflow-y:auto}
.overlay .modal{margin:auto}
/* alert/confirm 대체 대화상자.
   z-index가 잠금화면(100)보다 높아야 한다 — 잠금화면 위에서 부르는 확인들이 기존
   .overlay(60)를 쓰면 잠금 뒤에 가려 렌더되어, 사용자는 앱이 멈춘 것처럼 느낀다. */
.askov{position:fixed;inset:0;background:rgba(40,35,25,.5);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:18px;
  padding-top:calc(18px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)));
  padding-bottom:calc(18px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));overflow-y:auto}
.askov .modal{margin:auto;max-width:390px}
.askmsg{white-space:pre-line;font-size:14px;line-height:1.7;color:var(--ink2);margin:4px 0 0}
.askbtns{display:flex;gap:9px;margin-top:18px}
.askbtns button{flex:1;border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:700;border:1px solid var(--line)}
.askok{background:var(--accent);color:#fff;border-color:var(--accent)}
.askok.danger{background:var(--danger);border-color:var(--danger)}
.askcancel{background:var(--bg2);color:var(--ink2)}
/* emergency card */
/* v1.3.0 리뉴얼은 그라디언트를 걷어내고 플랫 + 테두리로 갔다. 하드코딩 hex 대신 --warn/--warnbg 토큰을
   쓰므로 다크 모드 별도 규칙이 필요 없다. */
.emcard{background:var(--warnbg);border:1.5px solid var(--warn);border-radius:var(--radius);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.emcard h3{margin:0 0 2px;font-size:16px;font-family:var(--serif);display:flex;align-items:center;gap:8px}
.emcard .sub{font-size:12.5px;color:var(--ink2);margin:0 0 12px}
/* search */
.searchwrap{position:relative;margin:0 0 16px}
.searchwrap .sicon{position:absolute;left:16px;top:23px;transform:translateY(-50%);color:var(--ink3);display:flex;pointer-events:none}
.searchwrap input{padding:11px 14px 11px 41px;border-radius:999px;font-size:14.5px;background:var(--card);box-shadow:var(--shadow)}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;box-shadow:var(--shadow);overflow:hidden;max-height:340px;overflow-y:auto}
.sres .ri{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.sres .ri:last-child{border-bottom:none}
.sres .ri:hover{background:var(--accent2)}
.sres .ri .path{color:var(--accent);font-weight:700;font-size:12px}
.sres .ri .val{color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* lock screen */
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
#lock .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px;max-width:320px;width:100%;text-align:center;box-shadow:var(--shadow)}
#lock h2{margin:0 0 6px;font-size:20px;font-family:var(--serif);color:var(--accent)}
#lock p{color:var(--ink2);font-size:13px;margin:0 0 16px}
#lock input{text-align:center;font-size:22px;letter-spacing:8px;padding:10px}
#lock .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:8px}
#lock button.open{width:100%;margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px}
#lock button.forgot{background:none;border:none;color:var(--ink3);font-size:12px;margin-top:10px}
/* settings & ai modals */
.set-sec{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:12px 0;background:var(--bg2)}
.set-sec h4{margin:0 0 8px;font-size:14.5px;font-family:var(--serif);color:var(--accent)}
.set-sec p{font-size:12.5px;color:var(--ink2);margin:6px 0}
.set-sec input,.set-sec select{margin:5px 0}
.set-sec .btnrow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.set-sec .btnrow button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 10px;font-size:13px}
.set-sec .btnrow button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.aihelp{margin-top:6px;border:1px dashed var(--accent3);background:var(--accent2);color:var(--accent);border-radius:9px;padding:6px 12px;font-size:12.5px;align-self:flex-start}
.aihelp:hover{border-style:solid}
/* photo fill */
.photofill{margin:2px 0 10px;border:1px dashed var(--accent3);background:var(--accent2);color:var(--accent);border-radius:9px;padding:7px 14px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.photofill:hover{border-style:solid}
.pf-thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.pf-th{position:relative}
.pf-th img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.pf-x{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;background:var(--ink2);color:#fff;font-size:11px;line-height:21px;text-align:center;border:none;padding:0}
.pf-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.pf-row input[type=checkbox]{margin-top:5px;flex:none}
.pf-lab{font-size:12px;color:var(--ink2);width:104px;flex:none;padding-top:4px;word-break:keep-all}
.pf-val{flex:1;min-width:0}
.pf-val input,.pf-val textarea{width:100%}
.pf-old{font-size:11.5px;color:var(--warn);margin-top:2px}
.pf-gt{font-weight:700;font-size:12.5px;margin-top:12px;color:var(--ink2)}
/* chat */
.chatbox{display:flex;flex-direction:column;height:min(70vh,540px)}
.chatlog{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bub.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--accent2);color:var(--ink);border-bottom-left-radius:4px}
.bub.load{color:var(--ink3);font-style:italic}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin textarea{min-height:78px;height:78px;flex:1}
.chatin button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 18px;font-size:14px;flex:none}
.disc{font-size:11.5px;color:var(--ink3);margin-top:8px;text-align:center}
.modal.wide{max-width:560px}
.modal textarea{margin:6px 0}
.modal label.mlab{font-size:12.5px;color:var(--ink2);display:block;margin-top:10px}
.modal .mrow{display:flex;gap:8px}
.modal .mrow>*{flex:1}
@media(max-width:560px){
  .frow{grid-template-columns:1fr}
  .brand span{display:none}
  .savebadge{display:none}
}
@media print{.top,.chips,.addrow,.photofill,.foot{display:none}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand" id="brandHome"><svg width="22" height="22" viewBox="0 0 72 72"><polygon points="60,14 10,36 33,44" fill="#2565B4"></polygon><polygon points="60,14 33,44 40,60" fill="#1D559C"></polygon><polygon points="60,14 33,44 33,52 38,46" fill="#16437C"></polygon></svg><b>만일의 노트</b><span>우리 가족 안심 기록장</span></div>
  <span class="savebadge" id="saveBadge"></span>
  <button class="tbtn" id="btnChat" title="장례·상속·행정 절차를 물어보는 AI 도우미">AI 도우미</button>
  <button class="tbtn" id="btnSet" title="문서·백업, 화면, 앱 잠금, AI 설정">설정</button>
  <input type="file" id="fileRestore" accept=".json" style="display:none">
</div></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

function migrateKeyV2(k){
  const p = k.split('.');
  /* 표 셀: sec.page[.iid].{gi}.t.{row}.{col} — keyIsSensitive와 같은 'p[-3]===t' 규칙 */
  if(p.length >= 5 && p[p.length-3] === 't'){
    const gi = p[p.length-4];
    if(/^\d+$/.test(gi)){ p[p.length-4] = 't'+gi; return p.join('.'); }
    return k;
  }
  /* 필드: sec.page[.iid].{gi}.fieldId */
  if(p.length >= 3 && /^\d+$/.test(p[p.length-2])){ p.splice(p.length-2, 1); return p.join('.'); }
  return k;
}

/** data 전체를 v2로 옮긴다. 이미 v2면 아무것도 하지 않는다 */
function migrateData(d){
  if(!d || d._keys >= KEYS_VERSION) return d;
  const vals = {};
  for(const k of Object.keys(d.values||{})) vals[migrateKeyV2(k)] = d.values[k];
  d.values = vals;
  /* 표 행 추가 개수는 그룹 접두사가 키다: sec.page[.iid].{gi} → …{t+gi} */
  const rows = {};
  for(const k of Object.keys(d.tableRows||{})){
    const p = k.split('.'); const last = p[p.length-1];
    if(/^\d+$/.test(last)) p[p.length-1] = 't'+last;
    rows[p.join('.')] = d.tableRows[k];
  }
  d.tableRows = rows;
  d._keys = KEYS_VERSION;
  return d;
}

/* ---------- alert/confirm 대체 ----------
   브라우저 기본 대화상자는 앱의 서체·색을 따르지 않아 리뉴얼한 화면 위에서 혼자 튄다.
   메시지에 오류 원문·파일 경로가 그대로 들어오므로 innerHTML이 아니라 textContent로 넣는다. */
function dialog(msg, opts){
  opts = opts || {};
  const isConfirm = !!opts.confirm;
  return new Promise(resolve=>{
    const ov = document.createElement('div'); ov.className='askov';
    const box = document.createElement('div'); box.className='modal';
    if(opts.title){ const h=document.createElement('h3'); h.textContent=opts.title; box.appendChild(h); }
    const p = document.createElement('p'); p.className='askmsg'; p.textContent = msg; box.appendChild(p);
    const btns = document.createElement('div'); btns.className='askbtns';
    let cancel = null;
    if(isConfirm){
      cancel = document.createElement('button'); cancel.className='askcancel';
      cancel.textContent = opts.cancelText || '취소'; btns.appendChild(cancel);
    }
    const ok = document.createElement('button');
    ok.className = 'askok' + (opts.danger ? ' danger' : '');
    ok.textContent = opts.okText || (isConfirm ? '확인' : '알겠어요');
    btns.appendChild(ok);
    box.appendChild(btns); ov.appendChild(box); document.body.appendChild(ov);

    const done = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); resolve(v); };
    function onKey(e){
      /* 캡처 단계에서 잡아 뒤에 있는 화면의 Enter/Esc 처리로 새지 않게 한다 */
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(isConfirm ? false : undefined); }
      else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); done(isConfirm ? true : undefined); }
    }
    document.addEventListener('keydown', onKey, true);
    ok.addEventListener('click', ()=>done(isConfirm ? true : undefined));
    if(cancel) cancel.addEventListener('click', ()=>done(false));
    /* 바깥을 눌러 닫는 건 알림에서만. 삭제 확인에서 허용하면 오조작이 '취소'인지 '확인'인지 모호해진다 */
    if(!isConfirm) ov.addEventListener('click', e=>{ if(e.target===ov) done(undefined); });
    setTimeout(()=>ok.focus(), 30);
  });
}
/** alert 대체 */
function notify(msg, title){ return dialog(msg, { title: title || null }); }
/** confirm 대체 — true/false를 준다 */
function ask(msg, opts){ return dialog(msg, Object.assign({ confirm:true }, opts||{})); }

const nonEmpty = v => Array.isArray(v) ? v.length>0 : (v!=null && String(v).trim()!=='');
function val(k){ return data.values[k]; }
function setVal(k,v){ if(!nonEmpty(v)) delete data.values[k]; else data.values[k]=v; save(); }
function countPrefix(pfx){ let n=0; for(const k in data.values){ if(k.startsWith(pfx) && nonEmpty(data.values[k])) n++; } return n; }
function instList(sec,page){ const key=sec.id+'.'+page.id; let l=data.instances[key]; if(!l||!l.length){ l=['i1']; data.instances[key]=l; } return l; }
/* conditional visibility (showIf on fields, showIfAny on pages) */
function condMatch(v, equals){ const eq = Array.isArray(equals)? equals : [equals]; if(Array.isArray(v)) return v.some(x=>eq.includes(x)); return eq.includes(v); }
function fieldVisible(f, page, pagePfx){
  if(!f.showIf) return true;
  return condMatch(val(pagePfx+'.'+f.showIf.field), f.showIf.equals);
}
function pageVisible(sec, page){
  const c = page.showIfAny; if(!c) return true;
  const cp = sec.pages.find(p=>p.id===c.page); if(!cp) return true;
  const ids = cp.repeat ? (data.instances[sec.id+'.'+cp.id]||['i1']) : [null];
  return ids.some(iid=> condMatch(val(sec.id+'.'+cp.id+(iid?'.'+iid:'')+'.'+c.field), c.equals));
}
function sectionControllers(sec){
  const s = new Set();
  for(const p of sec.pages){
    if(p.showIfAny) s.add(p.showIfAny.field);
    for(const g of p.groups||[]) for(const f of g.fields||[]) if(f.showIf) s.add(f.showIf.field);
  }
  return s;
}
function extraRows(pfx){ return data.tableRows[pfx]||0; }

let CUR_SEC = null;
function renderSection(secId){
  const sec = SCHEMA.find(s=>s.id===secId); if(!sec){ go({name:'home'}); return; }
  CUR_SEC = secId;
  let h = `<div class="crumb"><button id="backBtn">← 처음으로</button></div>
  <div class="sec-head"><span class="ic">${secIcon(sec.id,24)}</span><h2>${esc(sec.title)}</h2></div>`;
  const visPages = sec.pages.filter(p=>pageVisible(sec,p));
  h += `<div class="chips">` + visPages.map(p=>`<a href="#pg-${p.id}">${esc(p.title)}</a>`).join('') + `</div>`;
  for(const page of visPages){ h += renderPage(sec, page); }
  app.innerHTML = h;
  document.getElementById('backBtn').addEventListener('click',()=>go({name:'home'}));
  bindSectionEvents(sec);
}

function renderPage(sec, page){
  const pfx = sec.id+'.'+page.id;
  const n = countPrefix(pfx+'.');
  let inner='';
  if(page.note) inner += `<div class="pnote">${esc(page.note)}</div>`;
  const canPf = (page.groups||[]).some(g=>g.table || (g.fields||[]).some(f=>!f.sensitive));
  const pfBtn = canPf ? `<button class="photofill" data-page="${page.id}" title="사진을 올리면 AI가 읽고 항목을 채워줘요">${secIcon('camera',15)} 사진으로 채우기</button>` : '';
  if(page.repeat){
    const list = instList(sec,page);
    list.forEach((iid,idx)=>{ inner += renderInstance(sec,page,iid,idx,list.length); });
    inner += `<button class="addrow add-inst" data-sec="${sec.id}" data-page="${page.id}">${esc(page.addLabel||'+ 추가')}</button>` + pfBtn;
  }else{
    inner += pfBtn;
    page.groups.forEach(g=>{ inner += renderGroup(g, pfx, page); });
  }
  return `<details class="pagecard" id="pg-${page.id}" ${n>0?'open':''}><summary><h3>${esc(page.title)}</h3>${n>0?`<span class="cnt">${n}</span>`:''}<span class="arr">▶</span></summary><div class="pbody">${inner}</div></details>`;
}

function renderInstance(sec,page,iid,idx,total){
  const pfx = sec.id+'.'+page.id+'.'+iid;
  let title='';
  if(page.cardLabel){
    for(const g of page.groups){ const f=(g.fields||[]).find(f=>f.label===page.cardLabel); if(f){ title = val(pfx+'.'+f.id)||''; break; } }
  }
  let h = `<div class="inst" data-inst="${iid}"><div class="inst-head"><span class="no">${idx+1}</span><b class="inst-title">${esc(title)}</b>`;
  if(total>1) h += `<button class="del-inst" data-sec="${sec.id}" data-page="${page.id}" data-iid="${iid}">삭제</button>`;
  h += `</div>`;
  page.groups.forEach(g=>{ h += renderGroup(g, pfx, page); });
  return h+`</div>`;
}

/**
 * pfx는 페이지(또는 반복 카드) 접두사다 — 그룹 위치는 들어가지 않는다.
 * 필드 id가 페이지 안에서 유일하므로 그룹을 거칠 필요가 없고, 그래야 그룹을
 * 넣거나 순서를 바꿔도 기존 값이 밀리지 않는다.
 * 표는 필드 id가 없으니 그룹에 박아둔 g.id(고정값)를 쓴다.
 */
function renderGroup(g, pfx, page){
  let h='';
  if(g.title) h += `<div class="gtitle">${esc(g.title)}</div>`;
  if(g.note) h += `<div class="gnote">${esc(g.note)}</div>`;
  if(g.table) return h + renderTable(g.table, pfx+'.'+g.id);
  if(!g.fields) return h;
  h += `<div class="frow">`;
  for(const f of g.fields){
    if(page && !fieldVisible(f, page, pfx)) continue;
    h += renderField(f, pfx+'.'+f.id);
  }
  return h + `</div>`;
}

function renderField(f, key){
  const v = val(key);
  const cls = 'fld' + (f.wide||f.type==='textarea'||f.type==='checks'?' wide':'') + (f.sensitive?' sens':'');
  let inner='';
  const lock = f.sensitive?`<span class="lock"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5.5" y="10.5" width="13" height="9" rx="2"></rect><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"></path></svg></span>`:'';
  if(f.type==='textarea') inner = `<textarea data-key="${key}" placeholder="">${esc(v)}</textarea>` + (CUR_SEC==='endoflife'?`<button class="aihelp" data-target="${key}">AI로 글 다듬기</button>`:'');
  else if(f.type==='date') inner = `<input type="date" data-key="${key}" value="${esc(v)}">`;
  else if(f.type==='select'){
    inner = `<select data-key="${key}"><option value=""></option>` + (f.options||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('') + `</select>`;
  }
  else if(f.type==='radio'){
    inner = `<div class="optwrap">` + (f.options||[]).map(o=>`<label class="opt"><input type="radio" name="r-${key}" data-key="${key}" data-type="radio" value="${esc(o)}" ${v===o?'checked':''}>${esc(o)}</label>`).join('') + `</div>`;
  }
  else if(f.type==='checks'){
    const arr = Array.isArray(v)?v:[];
    inner = `<div class="optwrap">` + (f.options||[]).map(o=>`<label class="opt"><input type="checkbox" data-key="${key}" data-type="checks" value="${esc(o)}" ${arr.includes(o)?'checked':''}>${esc(o)}</label>`).join('') + `</div>`;
  }
  else inner = `<input type="text" data-key="${key}" value="${esc(v)}">`;
  return `<div class="${cls}"><label>${esc(f.label)}${lock}</label>${inner}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}

function renderTable(t, pfx){
  const cols = t.columns||[]; const presets = t.presets||[];
  const rows = presets.length + (t.rows||3) + extraRows(pfx);
  let h = `<div class="twrap"><table class="g"><thead><tr>` + cols.map(c=>`<th>${esc(c)}</th>`).join('') + `</tr></thead><tbody>`;
  for(let r=0;r<rows;r++){
    h += `<tr>`;
    for(let c=0;c<cols.length;c++){
      if(r<presets.length && c===0){ h += `<td class="preset">${esc(presets[r])}</td>`; }
      else{
        const key = pfx+'.t.'+r+'.'+c;
        h += `<td${t.sensitive?' class="sens-cell"':''}><input type="text" data-key="${key}" value="${esc(val(key))}"></td>`;
      }
    }
    h += `</tr>`;
  }
  h += `</tbody></table></div><button class="addrow add-trow" data-pfx="${pfx}">+ 행 추가</button>`;
  return h;
}

function bindSectionEvents(sec){
  const ctrlFields = sectionControllers(sec);
  app.querySelectorAll('[data-key]').forEach(el=>{
    const type = el.dataset.type;
    el.addEventListener(type==='radio'||type==='checks'?'change':'input', ()=>{
      const key = el.dataset.key;
      if(type==='checks'){
        const boxes = app.querySelectorAll(`input[data-key="${CSS.escape(key)}"]`);
        const arr=[]; boxes.forEach(b=>{ if(b.checked) arr.push(b.value); });
        setVal(key,arr);
      }else if(type==='radio'){ if(el.checked) setVal(key, el.value); }
      else setVal(key, el.value);
      const fid = key.split('.').pop();
      if(ctrlFields.has(fid) && (type==='radio'||type==='checks'||el.tagName==='SELECT')){
        const openIds=[...app.querySelectorAll('details[open]')].map(d=>d.id);
        const sy=window.scrollY;
        render();
        openIds.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
        window.scrollTo(0,sy);
        return;
      }
      const inst = el.closest('.inst');
      if(inst){
        const card = inst.closest('.pagecard'); const pageId = card.id.replace('pg-','');
        const page = sec.pages.find(p=>p.id===pageId);
        if(page && page.cardLabel){
          const fld = el.closest('.fld');
          /* 자물쇠는 인라인 SVG라 textContent 에 안 잡힌다 (예전 🔒 이모지 제거 코드는 삭제) */
          if(fld && fld.querySelector('label') && fld.querySelector('label').textContent.trim()===page.cardLabel){ inst.querySelector('.inst-title').textContent = el.value; }
        }
      }
    });
  });
  app.querySelectorAll('.add-inst').forEach(b=>b.addEventListener('click',()=>{
    const key=b.dataset.sec+'.'+b.dataset.page; const l=data.instances[key]||['i1'];
    let mx=0; l.forEach(id=>{ const n=parseInt(id.slice(1)); if(n>mx) mx=n; });
    l.push('i'+(mx+1)); data.instances[key]=l; save(); render();
    setTimeout(()=>{ const el=document.getElementById('pg-'+b.dataset.page); if(el){ el.open=true; el.scrollIntoView({block:'center'}); } },0);
  }));
  app.querySelectorAll('.del-inst').forEach(b=>b.addEventListener('click',async ()=>{
    if(!await ask('이 카드를 삭제할까요? 입력한 내용도 함께 지워져요.', {danger:true, okText:'삭제'})) return;
    const key=b.dataset.sec+'.'+b.dataset.page; const iid=b.dataset.iid;
    data.instances[key]=(data.instances[key]||[]).filter(x=>x!==iid);
    const vpfx=key+'.'+iid+'.';
    for(const k of Object.keys(data.values)){ if(k.startsWith(vpfx)) delete data.values[k]; }
    for(const k of Object.keys(data.tableRows)){ if(k.startsWith(vpfx)) delete data.tableRows[k]; }
    save(); render();
  }));
  app.querySelectorAll('.aihelp').forEach(b=>b.addEventListener('click',()=>openLetterModal(b.dataset.target)));
  app.querySelectorAll('.photofill').forEach(b=>b.addEventListener('click',()=>{
    const pg = sec.pages.find(p=>p.id===b.dataset.page);
    if(pg) openPhotoFillModal(sec, pg);
  }));
  app.querySelectorAll('.add-trow').forEach(b=>b.addEventListener('click',()=>{
    const pfx=b.dataset.pfx; data.tableRows[pfx]=(data.tableRows[pfx]||0)+1; save();
    const openIds=[...app.querySelectorAll('details[open]')].map(d=>d.id);
    render();
    openIds.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
    const d2=b.closest('details'); if(d2){ const nd=document.getElementById(d2.id); if(nd) nd.open=true; }
  }));
}

/* backup / restore */
/* 백업 파일에 스키마 버전을 넣어, 앞으로 항목 구조가 바뀌어도 불러올 때 판단할 수 있게 한다.
   v2부터 값 키에서 그룹 인덱스가 빠졌다(data._keys 참고). v1 백업은 불러오면서 변환한다. */
const SCHEMA_VERSION = 2;
function backupPayload(){
  return Object.assign({ _app:'manil-note', _schema:SCHEMA_VERSION, _appVersion:APP_VERSION, _exportedAt:new Date().toISOString() }, data);
}
async function doBackup(){
  try{
    const blob=new Blob([JSON.stringify(backupPayload(),null,1)],{type:'application/json'});
    const where = await dl(blob, '만일의노트_백업_'+dstr()+'.json');
    toast(where ? '백업했어요 — '+where : '백업을 저장하지 않았어요.');
  }catch(err){
    console.error('backup fail', err);
    await notify('백업 파일을 저장하지 못했어요.\n\n'+((err&&err.message)||err)+'\n\n다시 시도해도 안 되면, 설정에서 워드로 내보내기를 이용해 주세요.', '백업 실패');
  }
}
function doRestore(){ pickFile(document.getElementById('fileRestore')); }
document.getElementById('fileRestore').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{ try{
      const d=JSON.parse(rd.result);
      if(!d || typeof d!=='object' || !('values' in d)) throw new Error('형식이 맞지 않아요');
      if(d._schema && d._schema > SCHEMA_VERSION) throw new Error('더 새로운 버전의 앱에서 만든 백업이에요. 앱을 업데이트한 뒤 다시 불러와 주세요');
      if(!await ask('백업을 불러오면 지금 화면의 내용을 백업 내용으로 바꿔요. 계속할까요?', {okText:'불러오기'})) return;
      const base={owner:'',values:{},instances:{},tableRows:{},settings:{theme:null,hideSens:false}};
      /* 예전 앱에서 만든 백업은 그룹 인덱스가 박힌 v1 키다 — 불러오면서 함께 옮긴다 */
      migrateData(d);
      data=Object.assign(base,d);
      data.settings=Object.assign({theme:null,hideSens:false}, d.settings||{}); /* 얕은 병합이면 누락 키가 undefined가 된다 */
      delete data._app; delete data._schema; delete data._appVersion; delete data._exportedAt;
      data._keys = KEYS_VERSION;
      save(); applyTheme(); applySens(); render(); toast('백업을 불러왔어요.');
    }catch(err){ await notify('백업 파일을 읽을 수 없어요.\n\n'+((err&&err.message)||'만일의 노트에서 저장한 .json 파일인지 확인해 주세요.'), '불러오기 실패'); } };
  rd.onerror=()=>{ notify('파일을 읽지 못했어요. 다시 시도해 주세요.', '불러오기 실패'); };
  rd.readAsText(f); e.target.value='';
});
function dstr(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function isNative(){ return !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()); }
/* 시스템 파일·사진 선택기를 열면 앱이 백그라운드로 가므로, 그 사이 재잠금이 끼어들지 않게 표시해 둔다.
   선택을 마치거나 취소해 창으로 돌아오면(focus) 해제한다. */
function pickFile(el){
  _nativeIO++;
  let done = false;
  const clear = ()=>{ if(done) return; done = true; _nativeIO--; };
  window.addEventListener('focus', ()=>setTimeout(clear, 300), {once:true});
  el.addEventListener('change', ()=>setTimeout(clear, 300), {once:true});
  setTimeout(clear, 300000); /* 안전장치 — 어떤 이유로든 5분 뒤엔 해제 */
  el.click();
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
/* 파일을 사용자에게 전달한다. 성공하면 어디로 갔는지 알리는 문구를, 사용자가 취소하면 null을 반환하고,
   실패하면 throw 한다 — 호출부가 성공을 단정하지 않도록.
   안드로이드 11+는 앱이 공용 문서 폴더에 직접 쓸 수 없다(Capacitor의 Directory.Documents 미지원).
   그래서 앱 캐시에 쓴 뒤 공유 시트를 띄워 사용자가 저장 위치(드라이브·파일·메신저)를 고르게 한다. */
async function dl(blob,name){
  if(isNative()){
    const FS = Capacitor.Plugins.Filesystem, SH = Capacitor.Plugins.Share;
    if(!FS) throw new Error('파일 저장 기능을 쓸 수 없어요. 앱을 완전히 종료한 뒤 다시 열어 주세요.');
    const b64 = await blobToB64(blob);
    const w = await FS.writeFile({ path:name, data:b64, directory:'CACHE', recursive:true });
    if(!SH) throw new Error('파일은 만들었지만 공유 기능을 쓸 수 없어 저장 위치를 고를 수 없어요.');
    _nativeIO++;
    try{
      await SH.share({ title:name, url:w.uri, dialogTitle:'백업 파일을 저장할 곳 고르기' });
    }catch(e){
      if(/cancel/i.test(String((e&&e.message)||e))) return null; /* 사용자가 공유 시트를 닫음 */
      throw e;
    }finally{ _nativeIO--; }
    return '고른 위치에 '+name;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},800);
  return '다운로드 폴더에 '+name;
}

/* ---------- docx generation (A5) ---------- */
const X = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const FONT='<w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="맑은 고딕" w:cs="Malgun Gothic"/>';
function run(t,o){ o=o||{};
  let rpr='<w:rPr>'+FONT;
  if(o.b) rpr+='<w:b/>';
  if(o.i) rpr+='<w:i/>';
  if(o.color) rpr+=`<w:color w:val="${o.color}"/>`;
  rpr+=`<w:sz w:val="${o.sz||20}"/><w:szCs w:val="${o.sz||20}"/></w:rPr>`;
  const lines=String(t==null?'':t).split(/\r?\n/);
  let inner='';
  lines.forEach((ln,i)=>{ if(i>0) inner+='<w:br/>'; inner+=`<w:t xml:space="preserve">${X(ln)}</w:t>`; });
  return `<w:r>${rpr}${inner}</w:r>`;
}
function par(runs,o){ o=o||{};
  let ppr='<w:pPr>';
  if(o.pageBreak) ppr+='<w:pageBreakBefore/>';
  if(o.center) ppr+='<w:jc w:val="center"/>';
  ppr+=`<w:spacing w:before="${o.before||0}" w:after="${o.after==null?80:o.after}" w:line="264" w:lineRule="auto"/>`;
  if(o.border) ppr+='<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="3" w:color="A9C4E8"/></w:pBdr>';
  ppr+='</w:pPr>';
  return `<w:p>${ppr}${Array.isArray(runs)?runs.join(''):runs}</w:p>`;
}
const CONTENT_W=6577;
function tbl(cols, rows){ // rows: array of {cells:[{text,b,shade}], header}
  const cw=Math.floor(CONTENT_W/cols);
  let h=`<w:tbl><w:tblPr><w:tblW w:w="${CONTENT_W}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="BFD3EC"/><w:left w:val="single" w:sz="4" w:color="BFD3EC"/><w:bottom w:val="single" w:sz="4" w:color="BFD3EC"/><w:right w:val="single" w:sz="4" w:color="BFD3EC"/><w:insideH w:val="single" w:sz="4" w:color="BFD3EC"/><w:insideV w:val="single" w:sz="4" w:color="BFD3EC"/></w:tblBorders></w:tblPr><w:tblGrid>`;
  for(let i=0;i<cols;i++) h+=`<w:gridCol w:w="${cw}"/>`;
  h+='</w:tblGrid>';
  for(const r of rows){
    h+='<w:tr>';
    if(r.header) h+='<w:trPr><w:tblHeader/></w:trPr>';
    for(const c of r.cells){
      h+=`<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/>${c.shade?`<w:shd w:val="clear" w:fill="${c.shade}"/>`:''}<w:vAlign w:val="center"/></w:tcPr>`;
      h+=par(run(c.text||'', {b:c.b, sz:c.b?17:18}), {after:20});
      h+='</w:tc>';
    }
    h+='</w:tr>';
  }
  return h+'</w:tbl>'+par(run(''),{after:60});
}
const BLANK='＿＿＿＿＿＿＿＿';
function fieldLine(label, v, mode){
  const has=nonEmpty(v);
  if(!has && mode==='filled') return '';
  const vv = Array.isArray(v)? v.join(', ') : (has? v : BLANK);
  return par([run(label+'  ',{b:true,sz:17,color:'5E7CA8'}), run(vv,{sz:20})],{after:60});
}
function buildDocx(mode){
  let body='';
  // ----- cover -----
  body += par(run('',{}),{after:1200});
  body += par(run('만일의 노트',{b:true,sz:56,color:'1D559C'}),{center:true,after:200});
  body += par(run('우리 가족 안심 기록장',{sz:24,color:'5E7CA8'}),{center:true,after:600});
  body += par(run('이 노트는 '+(data.owner||'_______')+' 의 기록입니다.',{sz:22}),{center:true,after:200});
  body += par(run('작성일: '+new Date().toLocaleDateString('ko-KR'),{sz:18,color:'8A8378'}),{center:true,after:600});
  body += par(run('혹시 모를 그날, 남겨진 가족이 헤매지 않도록\n나와 우리 집의 중요한 정보를 담았습니다.\n소중히, 안전한 곳에 보관해 주세요.',{sz:18,color:'5E7CA8'}),{center:true});
  // ----- emergency card ----- (가장 급한 정보라 표지 다음 첫 장에 둔다)
  const emVals = EMFIELDS.map(f=>({ f, v:data.values['emcard.'+f.id] }));
  if(mode==='all' || emVals.some(x=>nonEmpty(x.v))){
    body += par(run('응급 정보 요약',{b:true,sz:30,color:'1D559C'}),{pageBreak:true,after:120,border:true});
    body += par(run('위급한 순간, 가족이나 구조자가 가장 먼저 봐야 할 정보입니다.',{sz:16,i:true,color:'8A8378'}),{after:160});
    for(const {f,v} of emVals) body += fieldLine(f.label, v, mode);
  }
  // ----- index -----
  const secsOut = SCHEMA.filter(sec=> mode==='all' || countPrefix(sec.id+'.')>0);
  body += par(run('차례',{b:true,sz:30,color:'1D559C'}),{pageBreak:true,after:200,border:true});
  secsOut.forEach((sec,i)=>{ body += par([run((i+1)+'.  ',{b:true,sz:20,color:'5E7CA8'}),run(sec.title,{sz:20})],{after:60}); });
  // ----- sections -----
  for(const sec of secsOut){
    /* 앱 화면은 SVG 라인 아이콘이라, 내보낸 문서에 이모지를 넣으면 브랜드가 어긋난다 */
    body += par(run(sec.title,{b:true,sz:30,color:'1D559C'}),{pageBreak:true,after:160,border:true});
    for(const page of sec.pages){
      const pfx=sec.id+'.'+page.id;
      if(mode==='filled' && countPrefix(pfx+'.')===0) continue;
      body += par(run(page.title,{b:true,sz:23}),{before:160,after:80});
      if(page.note && mode==='all') body += par(run(page.note,{sz:16,i:true,color:'8A8378'}),{after:100});
      if(page.repeat){
        const list = (data.instances[pfx]||['i1']);
        let no=0;
        for(const iid of list){
          const ipfx=pfx+'.'+iid;
          if(mode==='filled' && countPrefix(ipfx+'.')===0) continue;
          no++;
          if(list.length>1 || mode==='all') body += par(run('◈ '+page.title+' '+no,{b:true,sz:19,color:'5E7CA8'}),{before:80,after:60});
          body += groupsDocx(page.groups, ipfx, mode);
        }
        if(no===0 && mode==='all') body += groupsDocx(page.groups, pfx+'.i1', mode);
      }else{
        body += groupsDocx(page.groups, pfx, mode);
      }
    }
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body}
<w:sectPr><w:pgSz w:w="8391" w:h="11906"/><w:pgMar w:top="851" w:right="850" w:bottom="851" w:left="850" w:header="510" w:footer="510" w:gutter="0"/></w:sectPr>
</w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr>${FONT}<w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr></w:rPrDefault>
<w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
</w:styles>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const drels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  return zip([
    {name:'[Content_Types].xml', text:ct},
    {name:'_rels/.rels', text:rels},
    {name:'word/document.xml', text:doc},
    {name:'word/_rels/document.xml.rels', text:drels},
    {name:'word/styles.xml', text:styles}
  ]);
}
function groupsDocx(groups, pfx, mode){
  let h='';
  groups.forEach(g=>{
    const gpfx = g.table ? pfx+'.'+g.id : pfx;   // 필드는 페이지 접두사를 그대로 쓴다
    if(g.table){
      const cols=g.table.columns||[]; const presets=g.table.presets||[];
      const nrows=presets.length+(g.table.rows||3)+extraRows(gpfx);
      const rows=[{header:true, cells:cols.map(c=>({text:c,b:true,shade:'E7F0FB'}))}];
      let any=false;
      for(let r=0;r<nrows;r++){
        const cells=[]; let rowHas=false;
        for(let c=0;c<cols.length;c++){
          let t='';
          if(r<presets.length && c===0) t=presets[r];
          else t=val(gpfx+'.t.'+r+'.'+c)||'';
          if(c>0 && nonEmpty(t)) rowHas=true;
          if(r>=presets.length && c===0 && nonEmpty(t)) rowHas=true;
          cells.push({text:t});
        }
        if(mode==='filled' && !rowHas) continue;
        any=true; rows.push({cells});
      }
      if(mode==='filled' && !any) return;
      if(g.title) h += par(run(g.title,{b:true,sz:19,color:'1D559C'}),{before:100,after:60});
      h += tbl(cols.length, rows);
      return;
    }
    if(!g.fields) return;
    let lines='';
    for(const f of g.fields){
      const v=val(gpfx+'.'+f.id);
      if(f.type==='checks'){
        const arr=Array.isArray(v)?v:[];
        if(mode==='filled'){ if(arr.length) lines += fieldLine(f.label, arr.join(', '), mode); }
        else{
          lines += par(run(f.label,{b:true,sz:17,color:'5E7CA8'}),{after:40});
          for(const o of (f.options||[])) lines += par(run((arr.includes(o)?'☑ ':'☐ ')+o,{sz:19}),{after:30});
        }
      }else{
        lines += fieldLine(f.label, v, mode);
      }
    }
    if(!lines) return;
    if(g.title) h += par(run(g.title,{b:true,sz:19,color:'1D559C'}),{before:100,after:60});
    h += lines;
  });
  return h;
}

/* ---------- minimal ZIP (stored) ---------- */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1)? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder();
  const parts=[]; const central=[]; let offset=0;
  const dosTime=0x0000, dosDate=((2026-1980)<<9)|(7<<5)|19;
  for(const f of files){
    const nameB=enc.encode(f.name); const dataB=enc.encode(f.text);
    const crc=crc32(dataB);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,dataB.length,true); lh.setUint32(22,dataB.length,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nameB, dataB);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,dataB.length,true); ch.setUint32(24,dataB.length,true);
    ch.setUint16(28,nameB.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + dataB.length;
  }
  let cdSize=0; central.forEach(p=>cdSize+=p.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,offset,true);
  return new Blob([...parts, ...central, new Uint8Array(eo.buffer)], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

let _sIdx = null;
function searchIndex(){
  if(_sIdx) return _sIdx;
  _sIdx = [];
  for(const sec of SCHEMA){
    for(const page of sec.pages){
      const base = { sec:sec.id, page:page.id, path:`${sec.title} › ${page.title}` };
      _sIdx.push({...base, text:(sec.title+' '+page.title).toLowerCase(), label:page.title});
      for(const g of page.groups||[]){
        if(g.title) _sIdx.push({...base, text:g.title.toLowerCase(), label:g.title});
        for(const f of g.fields||[]) _sIdx.push({...base, text:f.label.toLowerCase(), label:f.label});
        if(g.table){ for(const c of g.table.columns||[]) _sIdx.push({...base, text:c.toLowerCase(), label:c});
          for(const p of g.table.presets||[]) _sIdx.push({...base, text:p.toLowerCase(), label:p}); }
      }
    }
  }
  return _sIdx;
}
/* 민감(자물쇠) 항목 판별 — "민감정보 가리기"가 켜졌을 때 검색 결과로 새어나가지 않게 한다.
   값 키 형태: sec.page[.iid].fieldId  또는  sec.page[.iid].tN.t.row.col */
let _sensSet = null;
function sensitiveIds(){
  if(_sensSet) return _sensSet;
  _sensSet = new Set();
  for(const sec of SCHEMA) for(const page of sec.pages||[]){
    for(const g of page.groups||[]){
      for(const f of g.fields||[]) if(f.sensitive) _sensSet.add(sec.id+'|'+page.id+'|'+f.id);
      if(g.table && g.table.sensitive) _sensSet.add(sec.id+'|'+page.id+'|␀table');
    }
  }
  return _sensSet;
}
function keyIsSensitive(k){
  const p = k.split('.'); if(p.length<3) return false;
  const S = sensitiveIds();
  if(p[p.length-3]==='t') return S.has(p[0]+'|'+p[1]+'|␀table');
  return S.has(p[0]+'|'+p[1]+'|'+p[p.length-1]);
}
function keyToPage(k){
  const parts = k.split('.');
  const sec = SCHEMA.find(s=>s.id===parts[0]); if(!sec) return null;
  const page = sec.pages.find(p=>p.id===parts[1]); if(!page) return null;
  return { sec:sec.id, page:page.id, path:`${sec.title} › ${page.title}` };
}

/* ---------- PIN lock ---------- */
const PIN_KEY = 'manil-note-pin';
const PINFAIL_KEY = 'manil-note-pinfail';

/*
 * 연속으로 틀리면 잠깐씩 쉬게 한다 — 폰을 주운 사람이 4자리를 전부 넣어보는 걸 늦추려는 것.
 *
 * 지연만 준다. 횟수가 아무리 쌓여도 기록을 지우거나 영구히 잠그지 않는다.
 * (예전에 해시 방식 불일치로 본인이 영영 못 들어가는 사고가 있었다 — 그 교훈이다.)
 * 카운트는 localStorage에 둔다. 메모리에만 두면 앱을 껐다 켜서 그냥 우회한다.
 */
const PIN_DELAY_AFTER = 5;                 /* 이 횟수까지는 지연 없음 */
const PIN_DELAY_MAX   = 5 * 60 * 1000;     /* 아무리 틀려도 5분을 넘기지 않는다 */
function pinFailRead(){
  /* until은 타임스탬프라 |0 으로 정수화하면 32비트를 넘겨 값이 망가진다 (Number로 읽을 것) */
  try{ const o = JSON.parse(localStorage.getItem(PINFAIL_KEY) || '{}'); return {n: o.n|0, until: Number(o.until) || 0}; }
  catch(e){ return {n:0, until:0}; }
}
/** 남은 대기 시간(ms). 0이면 지금 시도할 수 있다. */
function pinWaitLeft(){
  const {until} = pinFailRead();
  /* 시계를 과거로 돌리면 until이 한참 뒤로 보인다 — 상한을 넘는 값은 무효로 본다 */
  const left = until - Date.now();
  return (left > 0 && left <= PIN_DELAY_MAX) ? left : 0;
}
function pinFailBump(){
  const {n} = pinFailRead();
  const next = n + 1;
  const over = next - PIN_DELAY_AFTER;
  const wait = over > 0 ? Math.min(30000 * Math.pow(2, over - 1), PIN_DELAY_MAX) : 0;
  try{ localStorage.setItem(PINFAIL_KEY, JSON.stringify({n: next, until: wait ? Date.now() + wait : 0})); }catch(e){}
  return wait;
}
function pinFailClear(){ try{ localStorage.removeItem(PINFAIL_KEY); }catch(e){} }

/*
 * 저장된 해시는 "자기가 어떤 방식으로 만들어졌는지"를 스스로 말해야 한다.
 *
 * 예전에는 pinHash() 하나가 crypto.subtle을 쓰다가 실패하면 조용히 FNV로 넘어갔다.
 * 그래서 저장할 때와 확인할 때의 방식이 어긋나면 — 예를 들어 crypto.subtle이 없던
 * 웹뷰에서 비밀번호를 정한 뒤 웹뷰가 업데이트되면 — 맞는 비밀번호를 넣어도 영영
 * 열리지 않았다. 빠져나갈 길은 '비밀번호를 잊으셨나요?'뿐인데 그건 기록을 전부 지운다.
 * 기록을 지키려고 만든 앱에서 잠금 때문에 기록을 잃는 것이 가장 나쁜 결말이다.
 *
 * SHA-256 결과는 64자리 hex, FNV 결과는 'f'로 시작하는 9자 이하라 서로 구분된다.
 */
async function pinHashSha(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('manil:'+s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function pinHashFnv(s){
  let h=2166136261; const str='manil:'+s;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return 'f'+(h>>>0).toString(16);
}
/** 새로 저장할 해시 — 되도록 SHA-256, 정말 못 쓸 때만 FNV */
async function pinMake(s){
  try{ return await pinHashSha(s); }catch(e){ return pinHashFnv(s); }
}
const PIN_SHA_RE = /^[0-9a-f]{64}$/;
/**
 * 저장된 값이 만들어진 방식 그대로 검증한다.
 * 반환 'ok' 통과 / 'no' 비밀번호 불일치 / 'cannot' 이 기기에서 확인 자체가 불가
 * ('cannot'을 '비밀번호가 달라요'로 뭉뚱그리면 사용자를 초기화로 몰아간다)
 */
async function pinVerify(input, stored){
  if(!stored) return 'ok';
  if(PIN_SHA_RE.test(stored)){
    try{ return (await pinHashSha(input)) === stored ? 'ok' : 'no'; }
    catch(e){ return 'cannot'; }
  }
  return pinHashFnv(input) === stored ? 'ok' : 'no';
}
/** 옛 FNV 해시로 잠금을 푼 경우, 같은 비밀번호를 SHA-256으로 조용히 옮겨 둔다 */
async function pinUpgrade(input, stored){
  if(!stored || PIN_SHA_RE.test(stored)) return;
  try{ localStorage.setItem(PIN_KEY, await pinHashSha(input)); }catch(e){ /* 못 쓰면 그대로 둔다 */ }
}
function pinSet(){ return !!localStorage.getItem(PIN_KEY); }
function showLock(){
  const d = document.createElement('div'); d.id='lock';
  d.innerHTML = `<div class="box"><svg width="36" height="36" viewBox="0 0 72 72" style="margin-bottom:4px"><polygon points="60,14 10,36 33,44" fill="#2565B4"></polygon><polygon points="60,14 33,44 40,60" fill="#1D559C"></polygon><polygon points="60,14 33,44 33,52 38,46" fill="#16437C"></polygon></svg><h2>만일의 노트</h2><p>잠금 비밀번호를 입력해 주세요</p>

  document.body.appendChild(d);
  const errEl = ()=>document.getElementById('lockErr');

  let tick = null;

  /* 대기 중에는 열기 버튼을 잠그고 남은 시간을 세어 보여준다 */
  const paintWait = ()=>{
    const left = pinWaitLeft();
    if(left <= 0){ stopTick(); openBtn().disabled=false; errEl().textContent='이제 다시 시도할 수 있어요.'; return; }
    openBtn().disabled = true;
    errEl().textContent = '너무 여러 번 틀렸어요. '+Math.ceil(left/1000)+'초 뒤에 다시 시도할 수 있어요.';
  };
  const startWait = ()=>{ paintWait(); stopTick(); tick = setInterval(paintWait, 1000); };
  const tryOpen = async ()=>{
    if(pinWaitLeft() > 0){ startWait(); return; }
    const v = document.getElementById('lockIn').value;
    const stored = localStorage.getItem(PIN_KEY);
    const r = await pinVerify(v, stored);
    if(r === 'ok'){ pinFailClear(); stopTick(); await pinUpgrade(v, stored); d.remove(); return; }
    document.getElementById('lockIn').value='';
    if(r === 'cannot'){

      return;
    }
    if(pinFailBump() > 0){ startWait(); return; }

  };
  document.getElementById('lockOpen').addEventListener('click', tryOpen);
  document.getElementById('lockIn').addEventListener('keydown', e=>{ if(e.key==='Enter') tryOpen(); });

    if(!await ask('비밀번호를 잊으신 경우, 안전을 위해 이 기기의 기록을 초기화해야 잠금을 풀 수 있어요.\n\n삭제하면 되돌릴 수 없으니, 먼저 백업 파일을 만드는 것을 권합니다.\n\n계속할까요?',

        await notify('백업했어요 — '+where+'\n\n이제 초기화를 진행합니다.', '백업 완료');

/* ---------- AI core (Gemini + Claude, auto fallback) ---------- */
async function httpPost(url, headers, bodyObj){
  if(isNative() && Capacitor.Plugins && Capacitor.Plugins.CapacitorHttp){
    try{
      const r = await Capacitor.Plugins.CapacitorHttp.post({ url, headers, data: bodyObj });
      const j = (typeof r.data==='string') ? JSON.parse(r.data) : (r.data||{});
      return { status: r.status, json: j };
    }catch(e){ /* fall through to fetch */ }
  }
  let r;
  try{ r = await fetch(url, { method:'POST', headers, body: JSON.stringify(bodyObj) }); }
  catch(e){ throw new Error('인터넷 연결을 확인해 주세요. (AI 기능은 온라인에서만 동작해요)'); }
  const j = await r.json().catch(()=>({}));
  return { status: r.status, json: j };
}
function claudeErr(status, j){
  const t = j && j.error && j.error.type;
  if(status===401) return '클로드 API 키가 올바르지 않아요. 설정에서 키를 확인해 주세요.';
  if(status===429) return '클로드 요청이 많아 잠시 막혔어요. 1분 뒤에 다시 시도해 주세요.';
  if(status===400 && t==='invalid_request_error') return '요청에 문제가 있어요: '+((j.error&&j.error.message)||'');
  if(status>=500 || t==='overloaded_error') return 'AI 서버가 혼잡해요. 잠시 후 다시 시도해 주세요.';
  return '클로드 호출에 실패했어요 ('+status+')';
}
/* message content: 문자열 또는 [{text:'...'}, {img:{mime,data}}] 배열 (사진 인식용) */
function claudeContent(c){
  if(typeof c==='string') return c;
  return c.map(p=> p.img ? {type:'image', source:{type:'base64', media_type:p.img.mime, data:p.img.data}} : {type:'text', text:p.text});
}
function geminiParts(c){
  if(typeof c==='string') return [{text:c}];
  return c.map(p=> p.img ? {inline_data:{mime_type:p.img.mime, data:p.img.data}} : {text:p.text});
}
async function callClaude(system, messages){
  const cfg = aiCfg();
  /* max_tokens는 생각+답변 합산 상한이라, effort를 medium으로 두어 답변 분량을 확보한다 */
  const body = { model: cfg.model||'claude-opus-5', max_tokens: 16000,
    thinking:{type:'adaptive'}, output_config:{effort:'medium'}, system,
    messages: messages.map(m=>({role:m.role, content:claudeContent(m.content)})) };
  const { status, json } = await httpPost('https://api.anthropic.com/v1/messages',
    { 'content-type':'application/json', 'x-api-key':cfg.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }, body);
  if(status>=400) throw new Error(claudeErr(status, json));
  if(json.stop_reason==='refusal') throw new Error('안전상의 이유로 이 요청에는 답할 수 없어요. 내용을 바꿔 다시 시도해 주세요.');
  return (json.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}
const GEM_MODELS = ['gemini-3.5-flash','gemini-2.5-flash','gemini-flash-latest'];
async function callGemini(system, messages){
  const cfg = aiCfg();
  let lastErr = null;
  for(const model of GEM_MODELS){
    const body = { systemInstruction:{ parts:[{ text: system }] },
      contents: messages.map(m=>({ role: m.role==='assistant'?'model':'user', parts: geminiParts(m.content) })),
      generationConfig:{ maxOutputTokens: 8192 } };
    const { status, json } = await httpPost('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',
      { 'content-type':'application/json', 'x-goog-api-key': cfg.gkey }, body);
    if(status===404){ lastErr = new Error('제미나이 모델을 찾을 수 없어요.'); lastErr.quota = true; continue; }
    if(status>=400){
      const gs = (json.error && json.error.status) || '';
      const gm = (json.error && json.error.message) || '';
      const isQuota = status===429 || gs==='RESOURCE_EXHAUSTED' || status===503 || gs==='UNAVAILABLE';
      if(isQuota){
        // 모델별 무료 한도가 따로라서, 다음 제미나이 모델을 먼저 시도
        lastErr = new Error('제미나이 무료 사용량을 다 썼거나 서버가 혼잡해요.');
        lastErr.quota = true;
        continue;
      }
      const e = new Error(
        (status===400||status===403) && /key|credential|api/i.test(gm) ? '제미나이 API 키가 올바르지 않아요. 설정에서 확인해 주세요.' :
        '제미나이 호출에 실패했어요 ('+status+') '+gm);
      throw e;
    }
    const cand = json.candidates && json.candidates[0];
    const txt = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||'').join('').trim() : '';
    if(!txt){
      const br = json.promptFeedback && json.promptFeedback.blockReason;
      throw new Error(br ? '제미나이가 안전상의 이유로 답변을 거절했어요. 내용을 바꿔보세요.' : '제미나이가 빈 답변을 보냈어요. 다시 시도해 주세요.');
    }
    return txt;
  }
  throw (lastErr || new Error('제미나이 호출에 실패했어요.'));
}
async function aiCall(system, messages){
  const cfg = aiCfg();
  const hasG = !!cfg.gkey, hasC = !!cfg.key;
  if(!hasG && !hasC){ const e = new Error('⚙️ 설정에서 제미나이 또는 클로드 API 키를 먼저 등록해 주세요.'); e.noKey = true; throw e; }
  if(hasG){
    try{ return await callGemini(system, messages); }
    catch(e){
      if(hasC && e.quota){ toast('제미나이 한도 도달 — 클로드로 자동 전환했어요'); return await callClaude(system, messages); }
      throw e;
    }
  }
  return await callClaude(system, messages);
}

/* ---------- AI photo fill (사진으로 채우기) ---------- */
const PHOTO_SYS = `당신은 문서 사진에서 정보를 뽑아 정리하는 한국어 도우미입니다. 사용자가 올린 사진(보험 증권, 통장, 고지서, 명함, 안내문, 계약서 등)을 읽고, 주어진 항목 정의에 해당하는 값만 추출합니다.
규칙:
- 반드시 JSON 하나만 출력합니다. 설명이나 코드펜스, 다른 텍스트를 붙이지 않습니다.
- 형식: {"values":{"항목k":"값", ...}, "tables":{"표k":[["열1값","열2값",...], ...]}}
- 사진에서 분명히 읽을 수 있는 값만 넣습니다. 안 보이거나 불확실한 항목은 아예 빼세요. 추측 금지.
- type이 date인 항목은 YYYY-MM-DD 형식으로 씁니다.
- options가 있는 항목은 반드시 그 목록 중 하나만 고르고, 해당하는 것이 없으면 뺍니다. type이 checks인 항목은 목록에서 고른 값들의 배열로 씁니다.
- 표(tables)는 주어진 columns 순서대로 각 행을 배열로 만듭니다. 해당 내용이 없으면 그 표는 뺍니다.
- 전화번호·금액·번호는 사진에 적힌 그대로 옮깁니다.`;

function pfResize(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const MAX = 1568;
        let w = img.naturalWidth, h = img.naturalHeight;
        const sc = Math.min(1, MAX/Math.max(w,h));
        w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const dataUrl = cv.toDataURL('image/jpeg', 0.85);
        res({ mime:'image/jpeg', data:dataUrl.split(',')[1], preview:dataUrl });
      }catch(e){ URL.revokeObjectURL(url); rej(new Error('사진을 처리하지 못했어요. 다른 사진으로 시도해 주세요.')); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.')); };
    img.src = url;
  });
}

function pfSpec(page){
  const fields=[], tables=[];
  page.groups.forEach(g=>{
    if(g.table){ tables.push({ k:g.id, gid:g.id, title:g.title||'', tdef:g.table }); return; }
    (g.fields||[]).forEach(f=>{
      if(f.sensitive) return;
      fields.push({ k:f.id, label:(g.title? g.title+' — ':'')+f.label, type:f.type||'text', options:f.options||null });
    });
  });
  return { fields, tables };
}

function pfParse(txt){
  let s = String(txt||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a<0 || b<=a) throw new Error('AI 응답을 이해하지 못했어요. 다시 시도해 주세요.');
  try{ return JSON.parse(s.slice(a, b+1)); }
  catch(e){ throw new Error('AI 응답을 이해하지 못했어요. 다시 시도해 주세요.'); }
}

/* repeat 페이지: 마지막 카드가 비어 있으면 거기에, 아니면 새 카드에 채움 */
function pfTarget(sec,page){
  if(!page.repeat) return { pfx: sec.id+'.'+page.id, isNew:false };
  const key = sec.id+'.'+page.id, list = data.instances[key]||['i1'];
  const last = list[list.length-1];
  if(countPrefix(key+'.'+last+'.')===0) return { pfx:key+'.'+last, isNew:false };
  return { pfx:null, isNew:true };
}

function pfApplyTable(pfx, t, rows){
  const tpfx = pfx+'.'+t.gid;
  const cols = (t.tdef.columns||[]).length, presets = t.tdef.presets||[], base = presets.length+(t.tdef.rows||3);
  const rowEmpty = r=>{ for(let c=(r<presets.length?1:0); c<cols; c++){ if(nonEmpty(val(tpfx+'.t.'+r+'.'+c))) return false; } return true; };
  let n=0;
  for(const row of rows){
    let r=-1;
    const pi = presets.findIndex(p=>String(p).trim()===String(row[0]||'').trim());
    if(pi>=0 && rowEmpty(pi)) r=pi;
    if(r<0){ for(let i=presets.length; i<base+extraRows(tpfx); i++){ if(rowEmpty(i)){ r=i; break; } } }
    if(r<0){ data.tableRows[tpfx]=(data.tableRows[tpfx]||0)+1; r=base+extraRows(tpfx)-1; }
    for(let c=(r<presets.length?1:0); c<cols; c++){ if(nonEmpty(row[c])) setVal(tpfx+'.t.'+r+'.'+c, row[c]); }
    n++;
  }
  return n;
}

function openPhotoFillModal(sec, page){

  if(!spec.fields.length && !spec.tables.length){ notify('이 페이지에는 자동으로 채울 항목이 없어요.'); return; }
  const photos=[];
  const target = pfTarget(sec, page);
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="modal wide"><h3>사진으로 채우기 — ${esc(page.title)}</h3>
  <p style="font-size:13px;color:var(--ink2)">보험 증권·통장 표지·고지서·명함 같은 사진을 올리면 AI가 읽고 항목을 채워드려요. 최대 3장까지 올릴 수 있어요.</p>
  <p style="font-size:12.5px;color:var(--warn)">⚠️ 사진은 AI 서버(구글/Anthropic)로 전송돼요. 주민등록번호처럼 민감한 부분이 보이면 가리고 찍어주세요. 🔒 민감정보 항목은 자동 입력에서 제외됩니다.</p>
  <div class="pf-thumbs" id="pfThumbs"></div>
  <div class="btns"><button class="bigbtn" id="pfPick"><b>사진 고르기 · 찍기</b><small>갤러리나 카메라에서 선택</small></button>
  <button class="bigbtn" id="pfGo" style="display:none;border-color:var(--accent)"><b>AI로 읽기</b><small>10~30초 걸려요</small></button></div>
  <input type="file" id="pfFile" accept="image/*" multiple style="display:none">
  <div id="pfOut"></div>
  <div class="disc" id="pfStatus"></div>
  <button class="close">닫기</button></div>`;
  document.body.appendChild(ov);
  const $ = s=>ov.querySelector(s);
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  $('.close').addEventListener('click',()=>ov.remove());
  const drawThumbs = ()=>{
    $('#pfThumbs').innerHTML = photos.map((p,i)=>`<span class="pf-th"><img src="${p.preview}"><button class="pf-x" data-i="${i}">✕</button></span>`).join('');
    $('#pfGo').style.display = photos.length ? '' : 'none';
    $('#pfThumbs').querySelectorAll('.pf-x').forEach(b=>b.addEventListener('click',()=>{ photos.splice(+b.dataset.i,1); drawThumbs(); }));
  };
  $('#pfPick').addEventListener('click',()=>pickFile($('#pfFile')));
  $('#pfFile').addEventListener('change', async e=>{
    const files = [...e.target.files].slice(0, 3-photos.length);
    e.target.value='';
    for(const f of files){ try{ photos.push(await pfResize(f)); }catch(err){ await notify(err.message, '사진을 쓸 수 없어요'); } }
    if(e.target.files && photos.length>=3) toast('사진은 최대 3장까지예요.');
    drawThumbs();
  });
  $('#pfGo').addEventListener('click', async ()=>{
    if(!photos.length) return;
    const st = $('#pfStatus');
    st.textContent = 'AI가 사진을 읽는 중이에요... (10~30초)';
    $('#pfGo').disabled = true; $('#pfPick').disabled = true;
    try{
      const specForAI = { page: page.title,
        fields: spec.fields.map(x=>({ k:x.k, label:x.label, type:x.type, ...(x.options?{options:x.options}:{}) })),
        tables: spec.tables.map(x=>({ k:x.k, title:x.title, columns:x.tdef.columns||[], ...((x.tdef.presets||[]).length?{presets:x.tdef.presets}:{}) })) };
      const content = [ ...photos.map(p=>({img:{mime:p.mime, data:p.data}})),
        { text: '다음 항목 정의에 맞춰 사진에서 값을 추출해 JSON으로만 답하세요.\n'+JSON.stringify(specForAI) } ];
      const txt = await aiCall(PHOTO_SYS, [{role:'user', content}]);
      renderConfirm(pfParse(txt));
      st.textContent='';
    }catch(err){ st.textContent=''; await notify(err.message, '사진에서 읽지 못했어요'); }
    $('#pfGo').disabled = false; $('#pfPick').disabled = false;
  });
  function renderConfirm(j){
    const vals=[], jv=(j&&j.values)||{};
    for(const it of spec.fields){
      let v = jv[it.k]; if(v==null) continue;
      if(it.type==='checks'){
        const arr = (Array.isArray(v)?v:[v]).map(x=>String(x).trim()).filter(x=>(it.options||[]).includes(x));
        if(!arr.length) continue; v=arr;
      }else{
        v = String(Array.isArray(v)?v.join(', '):v).trim(); if(!v) continue;
        if((it.type==='select'||it.type==='radio') && it.options && !it.options.includes(v)){
          const m = it.options.find(o=>v.includes(o)||o.includes(v)); if(!m) continue; v=m;
        }
      }
      const old = target.pfx ? val(target.pfx+'.'+it.k) : null;
      vals.push({ it, v, old: nonEmpty(old)?old:null });
    }
    const tbls=[], jt=(j&&j.tables)||{};
    for(const t of spec.tables){
      let rows = jt[t.k]; if(!Array.isArray(rows)) continue;
      rows = rows.filter(r=>Array.isArray(r)&&r.some(c=>nonEmpty(c)))
                 .map(r=>(t.tdef.columns||[]).map((_,c)=>String(r[c]==null?'':r[c]).trim()));
      if(rows.length) tbls.push({ t, rows });
    }
    if(!vals.length && !tbls.length){
      $('#pfOut').innerHTML = '<p style="color:var(--warn);font-size:13px">사진에서 이 페이지에 넣을 내용을 찾지 못했어요. 더 선명한 사진이나 다른 사진으로 시도해 보세요.</p>';
      return;
    }
    let h = '<div class="gtitle">AI가 읽은 내용 — 확인하고 넣기</div>';
    if(target.isNew) h += '<p style="font-size:12.5px;color:var(--ink2)">새 카드를 만들어 아래 내용을 넣어요.</p>';
    h += vals.map((r,i)=>`<div class="pf-row"><input type="checkbox" data-pfv="${i}" ${r.old?'':'checked'}><span class="pf-lab">${esc(r.it.label)}</span><span class="pf-val">${
      r.it.type==='textarea' ? `<textarea data-pfin="${i}" style="min-height:56px">${esc(Array.isArray(r.v)?r.v.join(', '):r.v)}</textarea>`
                             : `<input type="text" data-pfin="${i}" value="${esc(Array.isArray(r.v)?r.v.join(', '):r.v)}">`
    }${r.old?`<div class="pf-old">⚠️ 체크하면 기존 값을 덮어써요: ${esc(Array.isArray(r.old)?r.old.join(', '):r.old)}</div>`:''}</span></div>`).join('');
    tbls.forEach((tb,ti)=>{
      h += `<div class="pf-gt">📋 ${esc(tb.t.title||'표')}</div>`;
      h += tb.rows.map((row,ri)=>`<div class="pf-row"><input type="checkbox" data-pft="${ti}.${ri}" checked><span class="pf-val" style="padding-top:3px;font-size:13px">${
        esc((tb.t.tdef.columns||[]).map((c,ci)=>row[ci]?c+': '+row[ci]:'').filter(Boolean).join(' · '))
      }</span></div>`).join('');
    });
    h += '<div class="btns" style="margin-top:10px"><button class="bigbtn" id="pfApply" style="border-color:var(--accent)"><b>선택한 내용 넣기</b><small>넣은 뒤에도 자유롭게 고칠 수 있어요</small></button></div>';
    $('#pfOut').innerHTML = h;
    $('#pfApply').addEventListener('click',async ()=>{
      let pfx = target.pfx;
      if(target.isNew){
        const key = sec.id+'.'+page.id, list = data.instances[key]||['i1'];
        let mx=0; list.forEach(id=>{ const n=parseInt(id.slice(1))||0; if(n>mx) mx=n; });
        const nid='i'+(mx+1); list.push(nid); data.instances[key]=list; pfx=key+'.'+nid;
      }
      let n=0;
      vals.forEach((r,i)=>{
        const cb = $(`[data-pfv="${i}"]`); if(!cb||!cb.checked) return;
        const inp = $(`[data-pfin="${i}"]`);
        let v = inp ? inp.value : (Array.isArray(r.v)?r.v.join(', '):r.v);
        if(r.it.type==='checks'){
          v = String(v).split(',').map(x=>x.trim()).filter(x=>(r.it.options||[]).includes(x));
          if(!v.length) return;
        }else{
          v = String(v).trim(); if(!v) return;
          if((r.it.type==='select'||r.it.type==='radio') && r.it.options && !r.it.options.includes(v)) return;
        }
        setVal(pfx+'.'+r.it.k, v); n++;
      });
      tbls.forEach((tb,ti)=>{
        const sel = tb.rows.filter((_,ri)=>{ const cb=$(`[data-pft="${ti}.${ri}"]`); return cb&&cb.checked; });
        if(sel.length) n += pfApplyTable(pfx, tb.t, sel);
      });
      if(!n){ await notify('넣을 항목을 선택해 주세요.'); return; }
      save();
      ov.remove();
      const openIds = [...app.querySelectorAll('details[open]')].map(d=>d.id);
      render();
      openIds.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
      const d2 = document.getElementById('pg-'+page.id); if(d2) d2.open=true;
      toast(n+'개 항목을 채웠어요. 내용을 확인해 주세요.');
    });
  }
}

/* ---------- AI letter helper ---------- */
const LETTER_SYS = `당신은 한국어 글쓰기 도우미입니다. 사용자가 사랑하는 사람에게 남기는 편지나 마지막 인사말을 쓰도록 돕습니다.
사용자가 준 메모, 일화, 마음을 바탕으로 진심이 느껴지는 자연스러운 한국어 글을 씁니다.
규칙: 과장되거나 상투적인 표현("하늘에서 지켜볼게" 남용 등)은 피하고, 사용자가 준 구체적인 일화와 단어를 최대한 살립니다. 지시된 말투와 길이를 따릅니다. 인삿말·본문·맺음말이 자연스럽게 이어지게 합니다. 편지 본문만 출력하고, 설명이나 머리말은 붙이지 않습니다.`;
function openLetterModal(targetKey){
  const cur = val(targetKey)||'';

  <p style="font-size:13px;color:var(--ink2)">전하고 싶은 마음이나 기억나는 일화를 편하게 적어주세요. AI가 편지 초안으로 다듬어 드려요. 마음에 들 때까지 다시 만들 수 있고, 마지막에 직접 고칠 수도 있어요.</p>
  <label class="mlab">받는 사람 (예: 딸 지은이에게, 남편에게)</label>
  <input id="ltTo" placeholder="비워두면 일반적인 인사로 시작해요">
  <label class="mlab">전하고 싶은 마음 · 일화 메모</label>
  <textarea id="ltMemo" style="min-height:110px" placeholder="예: 결혼식 때 손 잡아줘서 고마웠다 / 김치찌개 레시피는 냉장고에 붙여놨다 / 싸웠던 건 다 잊으라고...">${esc(cur)}</textarea>
  <div class="mrow">
    <div><label class="mlab">말투</label><select id="ltTone"><option>따뜻하고 다정하게</option><option>담담하고 차분하게</option><option>밝고 유쾌하게</option></select></div>
    <div><label class="mlab">길이</label><select id="ltLen"><option>보통 (10문장 안팎)</option><option>짧게 (5문장 안팎)</option><option>길게 (20문장 안팎)</option></select></div>
  </div>
  <div class="btns"><button class="bigbtn" id="ltGo"><b>초안 만들기</b><small>AI가 편지 초안을 써드려요</small></button></div>
  <div id="ltOut" style="display:none"><label class="mlab">AI 초안 (직접 고칠 수 있어요)</label>
  <textarea id="ltResult" style="min-height:160px"></textarea>
  <div class="btns" style="flex-direction:row"><button class="bigbtn" id="ltRetry" style="flex:1"><b>다시 만들기</b></button><button class="bigbtn" id="ltApply" style="flex:1;border-color:var(--accent)"><b>입력칸에 넣기</b></button></div></div>
  <div class="disc" id="ltStatus"></div>
  <button class="close">닫기</button></div>`;

  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });

    const memo = ov.querySelector('#ltMemo').value.trim();
    if(!memo){ await notify('전하고 싶은 마음을 한 줄이라도 적어주세요.'); return; }
    status.textContent = 'AI가 편지를 쓰는 중이에요... (10~30초)';
    ov.querySelector('#ltGo').disabled = true;
    try{
      const txt = await aiCall(LETTER_SYS, [{role:'user', content:
        `받는 사람: ${ov.querySelector('#ltTo').value.trim()||'(지정 안 함)'}\n말투: ${ov.querySelector('#ltTone').value}\n길이: ${ov.querySelector('#ltLen').value}\n\n메모:\n${memo}`}]);
      ov.querySelector('#ltResult').value = txt;
      ov.querySelector('#ltOut').style.display='block';
      status.textContent = '';
    }catch(e){ status.textContent=''; await notify(e.message, 'AI 요청 실패'); }
    ov.querySelector('#ltGo').disabled = false;
  };
  ov.querySelector('#ltGo').addEventListener('click', gen);
  ov.querySelector('#ltRetry').addEventListener('click', gen);
  ov.querySelector('#ltApply').addEventListener('click', async ()=>{
    const txt = ov.querySelector('#ltResult').value;
    /* 원문을 그냥 덮어쓰면 되돌릴 수 없다 — 내용이 있으면 아래에 원문을 남겨 둔다 */
    const prev = String(val(targetKey)||'');
    let next = txt;
    if(prev.trim()){
      if(!await ask('입력칸에 이미 쓰신 내용이 있어요.\n\n초안을 넣고, 원래 쓰신 글은 아래에 "원문 보관"으로 남겨 둘게요.',

    }
    setVal(targetKey, next);
    const ta = app.querySelector(`textarea[data-key="${CSS.escape(targetKey)}"]`);
    if(ta) ta.value = next;
    toast(prev.trim() ? '초안을 넣었어요. 원문은 아래에 남겨 뒀습니다.' : '입력칸에 넣었어요. 자동 저장됩니다.');
    ov.remove();
  });
}

/* ---------- AI chat helper ---------- */
const CHAT_SYS = `당신은 한국어 앱 '만일의 노트'(유사시를 대비해 가족을 위한 정보를 정리하는 기록장)의 안내 도우미입니다.
전문 분야: 한국의 장례 절차(3일장, 상조, 화장/매장/수목장), 사망 후 행정 절차(사망신고, 안심상속 원스톱서비스, 상속포기·한정승인, 상속세), 유언장 작성 방법, 사전연명의료의향서, 장기기증 등록, 보험금 청구, 디지털 유산 정리 등.
답변 규칙: 쉽고 따뜻한 한국어로, 간결하게. 절차는 단계별로. 기한이 있는 것(사망신고 1개월, 한정승인 3개월, 상속세 6개월 등)은 꼭 짚어줍니다. 법률·세무 판단이 필요하면 변호사·세무사 상담을 권합니다. 확실하지 않은 것은 확실하지 않다고 말합니다. 관련 내용을 앱의 해당 섹션에 기록해 두라고 자연스럽게 안내해도 좋습니다. 의료·정신적 위기 상담은 전문기관(129, 1393)을 안내합니다.`;
let chatHist = [];
/* 최근 20개만 유지하고, 전송 이력이 user로 시작하도록 맞춘다(두 API 모두 첫 메시지가 user여야 함) */
function trimChat(){
  if(chatHist.length>20) chatHist = chatHist.slice(-20);
  while(chatHist.length && chatHist[0].role!=='user') chatHist.shift();
}
document.getElementById('btnChat').addEventListener('click', ()=>{
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="modal wide"><h3>안내 도우미</h3>
  <div class="chatbox"><div class="chatlog" id="chatLog"></div>
  <div class="chatin"><textarea id="chatIn" placeholder="예: 사망신고는 어떻게 하나요? / 자필 유언장 요건이 뭐예요?"></textarea><button id="chatSend">보내기</button></div>
  <div class="disc">AI 답변은 참고용이에요. 중요한 결정은 전문가와 상의하세요. 대화 내용은 설정된 AI 서버(구글/Anthropic)로 전송됩니다.</div></div>
  <button class="close">닫기</button></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  ov.querySelector('.close').addEventListener('click',()=>ov.remove());
  const log = ov.querySelector('#chatLog');
  const draw = ()=>{ log.innerHTML = chatHist.map(m=>`<div class="bub ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('') || `<div class="bub a">안녕하세요. 장례 준비, 상속 절차, 유언장 같은 궁금한 점을 물어보세요.</div>`; log.scrollTop=log.scrollHeight; };
  draw();
  const send = async ()=>{
    const inp = ov.querySelector('#chatIn'); const q = inp.value.trim();
    if(!q) return;
    inp.value=''; chatHist.push({role:'user', content:q});
    trimChat();
    draw();
    log.insertAdjacentHTML('beforeend','<div class="bub a load" id="chatLoad">생각하는 중...</div>'); log.scrollTop=log.scrollHeight;
    ov.querySelector('#chatSend').disabled=true;
    try{
      /* err 표시된 앱 내부 오류 문구는 모델에 보내지 않는다 — 보내면 모델의 이전 답변으로 학습돼 대화가 오염된다 */
      const a = await aiCall(CHAT_SYS, chatHist.filter(m=>!m.err).map(m=>({role:m.role, content:m.content})));
      chatHist.push({role:'assistant', content:a});
    }catch(e){
      chatHist.push({role:'assistant', content:'⚠️ '+e.message, err:true});
    }
    trimChat();
    ov.querySelector('#chatSend').disabled=false;
    draw();
  };
  ov.querySelector('#chatSend').addEventListener('click', send);
  ov.querySelector('#chatIn').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
});

/* ---------- android (capacitor) ---------- */

  <p style="font-size:13px;color:var(--ink2)">작성한 내용은 모두 자동 저장되어 있어요.</p>
  <div class="btns" style="flex-direction:row">
  <button class="bigbtn" id="exitCancel" style="flex:1;text-align:center"><b>취소</b></button>
  <button class="bigbtn" id="exitGo" style="flex:1;text-align:center;border-color:var(--danger);color:var(--danger)"><b>종료</b></button>
  </div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
  ov.querySelector('#exitCancel').addEventListener('click', ()=>ov.remove());
  ov.querySelector('#exitGo').addEventListener('click', ()=>{ try{ Capacitor.Plugins.App.exitApp(); }catch(e){ ov.remove(); } });
}
try{
  if(isNative() && Capacitor.Plugins && Capacitor.Plugins.App){
    Capacitor.Plugins.App.addListener('backButton', ()=>{
      /* 잠금화면은 .overlay 가 아니고 z-index가 더 높다 — 가드가 없으면 보이지 않는 종료창이 뒤에 떠버린다 */
      if(document.getElementById('lock')) return;
      const ovs = document.querySelectorAll('.overlay');
      if(ovs.length){ ovs[ovs.length-1].remove(); return; }
      if(view.name==='section'){ go({name:'home'}); return; }
      showExitConfirm();
    });
    /* 백그라운드에 다녀오면 다시 잠근다. 단, 공유 시트·사진 선택처럼 앱이 의도적으로 띄운
       화면에서 돌아오는 경우( _nativeIO )와 짧은 전환(RELOCK_GRACE)은 제외한다. */
    let _leftAt = 0;
    Capacitor.Plugins.App.addListener('appStateChange', ({isActive})=>{
      if(!isActive){ _leftAt = Date.now(); return; }
      if(!pinSet() || document.getElementById('lock')) return;
      if(_nativeIO > 0) return;
      if(_leftAt && Date.now() - _leftAt > RELOCK_GRACE) showLock();
    });
  }
}catch(e){ console.warn(e); }

/* ---------- 웹(PWA) 전용 ---------- */
if(!isNative()){
  /* 오프라인 실행용 서비스 워커. file:// 로 열었거나 미지원 브라우저면 조용히 건너뛴다. */
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw', e)); });
  }
  /* 다른 앱에 다녀오면 다시 잠근다 — 네이티브의 appStateChange 와 같은 규칙(_nativeIO·RELOCK_GRACE). */
  let _leftAt = 0;
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ _leftAt = Date.now(); return; }
    if(!pinSet() || document.getElementById('lock')) return;
    if(_nativeIO > 0) return;
    if(_leftAt && Date.now() - _leftAt > RELOCK_GRACE) showLock();
  });
}

/* ---------- boot ---------- */
if(pinSet()) showLock();
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!data.settings.theme) applyTheme(); });
render();
badge('');
</script>
</body>
</html>
